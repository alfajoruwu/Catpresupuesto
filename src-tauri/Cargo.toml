[package]
name = "catpresupuesto"
version = "0.1.0"
edition = "2021"

[lib]
name = "catpresupuesto_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
chrono = "0.4"

[build-dependencies]
tauri-build = "2"
